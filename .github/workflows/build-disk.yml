---
# Builds the LegionForge installer ISO. Manual only: run it from the Actions
# tab ("Build installer ISO" -> Run workflow) or with
#   gh workflow run build-disk.yml
# The ISO and its SHA256SUMS are kept as a run artifact for 7 days. Nothing is
# published: distributing an ISO is a separate, deliberate step.
name: Build installer ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build the ISO from"
        required: false
        default: "latest"
        type: string

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer ISO
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "USER_UID=$(id -u)" >> ${GITHUB_ENV}
          echo "USER_GID=$(id -g)" >> ${GITHUB_ENV}

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'  # same as build.yml

      # Only build an ISO of an image that is signed with this repo's key.
      - name: Verify the image signature
        run: |
          cosign verify --key cosign.pub \
            "${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}" > /dev/null
          echo "Signature OK for ${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}"

      # bootc-image-builder's own GitHub Actions workaround
      # (osbuild/bootc-image-builder#446): a clean rootful overlay store.
      - name: Configure podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf > /dev/null

      # Fedora 45 keeps its base repos (fedora, updates) in
      # /usr/share/dnf5/repos.d, which dnf5 reads but bootc-image-builder's
      # depsolver doesn't: it only reads /etc/yum.repos.d, so every installer
      # package (anaconda, grub2, shim) was "No match". Build the ISO from a
      # local copy with those repo files also in /etc/yum.repos.d. Installs
      # switch to the signed registry image on first boot regardless.
      - name: Prepare image for the installer build
        run: |
          set -euo pipefail
          src="${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}"
          sudo podman pull "$src"
          printf 'FROM %s\nRUN cp /usr/share/dnf5/repos.d/fedora.repo /usr/share/dnf5/repos.d/fedora-updates.repo /etc/yum.repos.d/\n' "$src" > Containerfile.iso
          sudo podman build --pull=never -t localhost/legionforge-iso:latest -f Containerfile.iso .

      # Run bootc-image-builder directly (what the deprecated
      # bootc-image-builder-action does), because the action always pulls
      # the image and so can't use the local one above.
      - name: Build ISO
        id: build
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman pull "${BIB_IMAGE}"
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            --volume /var/lib/containers/storage:/var/lib/containers/storage \
            --volume "$PWD/output:/output" \
            --volume "$PWD/disk_config/iso.toml:/config.toml:ro" \
            "${BIB_IMAGE}" \
            build --output /output --chown "${USER_UID}:${USER_GID}" --use-librepo=True \
            --type anaconda-iso localhost/legionforge-iso:latest
          echo "output-directory=$PWD/output" >> "$GITHUB_OUTPUT"

      - name: Checksum and report size
        id: report
        working-directory: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          iso="$(find . -name '*.iso' -type f | head -1)"
          test -n "$iso"
          name="legionforge-$(date -u +%Y%m%d)-${GITHUB_SHA::7}.iso"
          mv "$iso" "$name"
          sha256sum "$name" > SHA256SUMS
          bytes="$(stat -c %s "$name")"
          gib="$(awk -v b="$bytes" 'BEGIN { printf "%.2f", b / 1024^3 }')"
          {
            echo "## Installer ISO"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$name\` |"
            echo "| Size | **${gib} GiB** (${bytes} bytes) |"
            echo "| Image | \`${IMAGE_REGISTRY}/${IMAGE_NAME}:${{ inputs.tag }}\` |"
            echo "| SHA-256 | \`$(cut -d' ' -f1 SHA256SUMS)\` |"
            echo ""
            echo "Download it from this run's **Artifacts** (kept 7 days). Nothing was published."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Built $name: ${gib} GiB"

      - name: Upload ISO as a run artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legionforge-iso
          path: |
            ${{ steps.build.outputs.output-directory }}/*.iso
            ${{ steps.build.outputs.output-directory }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
