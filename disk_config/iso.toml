# Anaconda installer ISO for Legix, built locally with `just build-iso`
# (not built or published by CI; see CONTRIBUTING.md).

[customizations.installer.kickstart]
contents = """
%post
# Track Legix from the registry with signature checking on from day one.
# The installed system already trusts Legix's key (policy.json), so
# every update must be signed with cosign.pub.
bootc switch --mutate-in-place --transport registry --enforce-container-sigpolicy ghcr.io/shad0wcrawl3r/legix:latest
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  # Bazzite Deck GNOME has no GNOME Initial Setup, so the installer must
  # create the user account.
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
